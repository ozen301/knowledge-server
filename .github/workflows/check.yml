name: Check

# Only main is checked. The dev branch holds work in progress that may not
# pass yet; validate it locally with scripts/check.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Python 3.14 is both the development pin and the declared minimum. If
      # .python-version moves ahead of 3.14, add a separate run on 3.14.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      # The search tests run the real ripgrep executable.
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: scripts/check --ci
