[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-server"
version = "0.1.0"
description = "Read-only MCP server for a personal knowledge base."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "cryptography>=50,<51",
    "httpx2>=2.13,<3",
    "mcp>=2.2,<3",
    "pydantic>=2,<3",
    "PyJWT[crypto]>=2.15,<3",
    "starlette>=1.7,<2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
knowledge-server = "knowledge_server.__main__:main"
knowledge-server-http = "knowledge_server.adapter.http_main:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_server"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
# The sample notes are test data; Ruff would reformat their code blocks.
extend-exclude = ["tests/fixtures/vault"]

[tool.ruff.lint]
extend-select = ["I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
